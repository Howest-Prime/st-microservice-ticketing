services:
  ticketing-db.howestprime.dev:
    image: mongo:latest
    container_name: ticketing-db.howestprime.dev
    restart: unless-stopped
    env_file:
      - ./.ticketing-db.howestprime.dev.env
    ports:
      - "40131:5000"
    volumes:
      - ../../data:/data/db
    networks:
      - ticketing-howestprime-dev
    command: >
      bash -c "
        mongod --port 5000 --replSet rs0 --bind_ip_all &
        until mongosh --port 5000 --eval 'print(\"waited for connection\")'
        do
          sleep 1
        done
        mongosh --port 5000 --eval 'rs.initiate({
          _id: \"rs0\",
          members: [{ _id: 0, host: \"ticketing-db.howestprime.dev:5000\" }]
        })'
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 5000 --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s


  ticketing-messagebroker.howestprime.dev:
    image: cloudamqp/lavinmq
    container_name: ticketing-messagebroker.howestprime.dev
    restart: unless-stopped
    ports:
      - "40100:5672"
      - "40101:15672"
    networks:
      - ticketing-howestprime-dev
    healthcheck:
      test: ["CMD-SHELL", "lavinmqctl status | grep -q 'Uptime: ' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s


networks:
  ticketing-howestprime-dev:
    name: ticketing-howestprime-dev
    ipam:
      config:
        - subnet: 10.21.0.0/16